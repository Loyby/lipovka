# The iPhone app's Xcode project, generated by XcodeGen (brew install xcodegen; xcodegen generate).
# CI does this itself: see .github/workflows/ios.yml.
name: Lipovka
options:
  bundleIdPrefix: app.lipovka
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0.31"
    CURRENT_PROJECT_VERSION: "31"
targets:
  Lipovka:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - "ambience"
          - "Info.plist"
      # the recordings for the iPhone (AAC), at ambience/ in the bundle
      - path: iosApp/ambience
        type: folder
        buildPhase: resources
      # the game's content and the toys' sounds, shared with Android, at assets/ in the bundle
      - path: ../app/src/main/assets
        name: assets
        type: folder
        buildPhase: resources
      - path: ../app/src/main/resources/sprites
        type: folder
        buildPhase: resources
      - path: ../app/src/main/resources/qr_play.txt
        buildPhase: resources
      - path: ../shared/src/androidMain/res/font/m6x11.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lipovka.ios
        PRODUCT_NAME: Lipovka
        INFOPLIST_FILE: iosApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Build the shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
schemes:
  Lipovka:
    build:
      targets:
        Lipovka: all
    run:
      config: Debug
    archive:
      config: Release
